{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2><i class="fas fa-key text-accent me-2"></i>Change Password</h2>
        
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-bold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger mt-1" style="font-size: 0.85rem;">
                    {% for error in field.errors %}{{ error }}{% endfor %}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            
            <button type="submit" class="btn btn-accent w-100 btn-lg">
                <i class="fas fa-save me-2"></i> Update Password
            </button>
        </form>
        
        <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary w-100 mt-3">
            <i class="fas fa-arrow-left me-1"></i> Back to Profile
        </a>
    </div>
</div>
{% endblock %}
