{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — EventPOS</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
            <span class="alert-close">×</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <h1>EventPOS</h1>
                <p>Sign in to your account</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-input" required autofocus
                           placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-input" required
                           placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
            </form>

            <div class="auth-divider">or</div>

            <div class="auth-footer">
                Don't have an account? <a href="{% url 'register' %}">Create Account</a>
            </div>

            <div style="margin-top: 20px; padding: 14px; background: var(--color-bg-input); border-radius: var(--radius-md); text-align: center;">
                <p style="font-size: 0.72rem; color: var(--color-text-muted); margin-bottom: 4px;">Demo Credentials</p>
                <p style="font-family: var(--font-mono); font-size: 0.78rem;">testuser / test1234</p>
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
